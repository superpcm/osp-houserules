name: Quality and release package

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: osp-houserules-${{ github.sha }}
          path: release/*.zip
