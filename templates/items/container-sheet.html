<form class="{{cssClass}}" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img is-pos-container-image" src="{{img}}" data-edit="img" title="{{name}}" />
    <div class="header-col">
      <h1 class="charname is-pos-container-name">
        {{#if @root.isGM}}
          <input type="text" name="name" value="{{name}}" />
        {{else}}
          <span>{{name}}</span>
        {{/if}}
      </h1>
      <div class="details">
        <div class="form-group">
          <input type="number" class="is-pos-cost" name="system.cost" value="{{system.cost}}" min="0" {{#unless @root.isGM}}readonly disabled{{/unless}} />
        </div>
        <div class="form-group">
          <input type="number" class="is-pos-weight" name="system.unitWeight" value="{{system.unitWeight}}" min="0" step="0.1" {{#unless @root.isGM}}readonly disabled{{/unless}} />
        </div>
        <div class="form-group">
          <input type="number" class="is-pos-size" name="system.storedSize" value="{{system.storedSize}}" min="0" step="0.25" {{#unless @root.isGM}}readonly disabled{{/unless}} />
        </div>
      </div>
    </div>
  </header>

  {{#if @root.isGM}}
    <section class="osp-item-stocking-fields"><h3>Merchant Stocking</h3>
      <label>Availability <select name="system.storeAvailability"><option value="" {{#unless system.storeAvailability}}selected{{/unless}}>Unclassified</option><option value="common" {{#if (eq system.storeAvailability "common")}}selected{{/if}}>Common</option><option value="uncommon" {{#if (eq system.storeAvailability "uncommon")}}selected{{/if}}>Uncommon</option><option value="rare" {{#if (eq system.storeAvailability "rare")}}selected{{/if}}>Rare</option><option value="exceptional" {{#if (eq system.storeAvailability "exceptional")}}selected{{/if}}>Exceptional</option></select></label>
      <label>Blacksmith eligibility <select name="system.blacksmithEligible"><option value="" {{#if (eq system.blacksmithEligible null)}}selected{{/if}}>Unset</option><option value="true" {{#if system.blacksmithEligible}}selected{{/if}}>Eligible</option><option value="false" {{#if (eq system.blacksmithEligible false)}}selected{{/if}}>Excluded</option></select></label>
    </section>
  {{/if}}

  {{#if @root.isGM}}
  <section class="osp-item-stocking-fields">
    <h3>Vehicle Fittings</h3>
    {{#if canBeVehicle}}<label>Vehicle type <select name="system.vehicleKind"><option value="" {{#unless system.vehicleKind}}selected{{/unless}}>Use catalog default</option>{{#each vehicleKindOptions}}<option value="{{id}}" {{#if selected}}selected{{/if}}>{{label}}</option>{{/each}}</select></label>{{/if}}
    <label>Vehicle fitting <select name="system.vehicleAttachmentKind"><option value="" {{#unless system.vehicleAttachmentKind}}selected{{/unless}}>Use catalog default</option>{{#each vehicleAttachmentKindOptions}}<option value="{{id}}" {{#if selected}}selected{{/if}}>{{label}}</option>{{/each}}</select></label>
  </section>
  {{/if}}

  <section class="sheet-body">
    <div class="flexrow">
      <div class="stats">
      <div class="form-group">
        <input type="text" class="is-pos-capacity" name="system.capacity" value="{{system.capacity}}" placeholder="6M" {{#unless @root.isGM}}readonly disabled{{/unless}} />
      </div>        <div class="form-group">
          <input type="number" class="is-pos-quantity" name="system.quantity" value="{{system.quantity}}" min="0" />
        </div>
      </div>

      <div class="description">
        <textarea class="is-pos-description" name="system.description" {{#unless @root.isGM}}readonly disabled{{/unless}}>{{system.description}}</textarea>
      </div>
    </div>
  </section>
</form>
